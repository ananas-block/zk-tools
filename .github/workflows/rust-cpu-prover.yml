name: Rust CPU prover
on:
  pull_request:
  push:
    branches: [main, jorrit/rust-cpu-prover]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        features: [setup, 'setup,parallel']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust/cpu-prover
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: rustup update stable --no-self-update
      - run: cargo fmt --check
      - name: Default-feature proof blinding and equivalence gates
        if: matrix.features == 'setup'
        run: cargo test --locked --release
      - run: cargo test --locked --release --features '${{ matrix.features }}'
  wasm:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        simd: ['', '+simd128']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: rustup target add wasm32-unknown-unknown
      - uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2
        with:
          tool: wasm-pack@0.15.0
      - name: Standalone WASM proof, blinding and arithmetic checks
        env:
          RUSTFLAGS: ${{ matrix.simd && '-C target-feature=+simd128' || '' }}
        run: wasm-pack test --node --release rust/cpu-prover --locked --features wasm-prover,test-support
